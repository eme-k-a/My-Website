<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Artifact studies · Commit History</title>
    <link rel="stylesheet" href="studio.css" />
    <script src="studio.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <a id="exhibit-link" href="/exhibit/klarup/">KlarUp exhibit</a>
        <nav aria-label="Artifact studies">
          <button id="klarup" aria-pressed="true">KlarUp</button
          ><button id="verafin" aria-pressed="false">Verafin</button>
        </nav>
      </header>
      <noscript>
        <style>
          header,
          section[aria-labelledby='title'] {
            display: none;
          }
        </style>
        <h1>Artifact studies</h1>
        <figure>
          <img
            src="klarup.webp"
            width="626"
            height="413"
            alt="A dotted gap interrupts the upper row of session lights on a glass disc."
          />
          <figcaption>
            Someone Showed Up. Your partner checks in when you miss a practice session.
            <a href="/exhibit/klarup/">KlarUp exhibit</a>
          </figcaption>
        </figure>
        <figure>
          <img
            src="verafin.webp"
            width="626"
            height="413"
            alt="Three cartridges on the reverse of the report tile, with the blue one released."
          />
          <figcaption>
            Editions. The blue module supplies the activity chart on the front.
            <a href="/exhibit/verafin/">Verafin exhibit</a>
          </figcaption>
        </figure>
      </noscript>
      <section aria-labelledby="title">
        <h1 id="title">Someone Showed Up</h1>
        <p id="intro">Two people keep a practice. One misses a session. Their partner checks in.</p>
        <div id="stage" tabindex="0" aria-label="Rotate sculpture. Drag or use arrow keys.">
          <div id="shadow"></div>
          <div id="sculpture">
            <div id="disc"></div>
            <div id="tile" hidden></div>
          </div>
        </div>
        <ol id="story" aria-label="The check-in story">
          <li>Miss a session</li>
          <li>Partner checks in</li>
          <li>Return to practice</li>
        </ol>
        <div class="actions">
          <button id="action">Play the check-in</button><button id="flip">View edge</button
          ><button id="reset">Reset view</button>
        </div>
        <p id="status" role="status"></p>
        <p class="hint">Drag the object to rotate. Swipe outside its frame to scroll.</p>
      </section>
    </main>
  </body>
</html>
